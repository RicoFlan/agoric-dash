# fly.toml — https://fly.io/docs/reference/configuration/
# Next.js: `npm start` uses $PORT (Fly sets it, usually 8080). Keep internal_port in sync.

app = "agoric-dash"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
